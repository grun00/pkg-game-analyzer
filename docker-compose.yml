services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pkm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pkm_game_analyzer_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkm"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    # Reached by the frontend container over the internal network. Exposed on
    # 3000 for direct debugging; public traffic goes through `frontend`.
    ports:
      - "3000:3000"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      DATABASE_URL: postgres://pkm:${POSTGRES_PASSWORD}@db/pkm_game_analyzer_production
      RAILS_LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Public entrypoint: serves the SPA and reverse-proxies /api -> web:3000.
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://web:3000
      PORT: 80
    depends_on:
      - web

volumes:
  postgres_data:
