# Rendered by docker-entrypoint.sh: ${BACKEND_URL} and ${PORT} are substituted
# at container start, then nginx serves the SPA and proxies /api to Rails.

server {
    listen       ${PORT};
    listen  [::]:${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the API to the Rails backend (same-origin -> no browser CORS).
    location /api/ {
        # Resolve the upstream at request time (via a variable) so nginx starts
        # even if the backend container isn't up yet, and picks up new IPs on
        # restart. ${RESOLVER} is the container DNS (Docker/Railway embedded DNS).
        resolver ${RESOLVER} valid=10s ipv6=off;
        set $backend "${BACKEND_URL}";
        # $request_uri is required because a variabled proxy_pass does not
        # forward the location's URI automatically.
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Public traffic reaches this proxy over HTTPS (Railway edge terminates
        # TLS); force https so Rails' ASSUME_SSL/FORCE_SSL doesn't redirect-loop
        # the internal HTTP hop to the backend.
        proxy_set_header X-Forwarded-Proto https;
        # Preserve the Authorization (JWT) header in both directions.
        proxy_set_header Authorization     $http_authorization;
        proxy_pass_request_headers on;
    }

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
