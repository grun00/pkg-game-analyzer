# Railway configuration for the pkm_game_analyzer FRONTEND (SPA + nginx) service.
#
# In the Railway frontend service settings:
#   - Root Directory: frontend
#   - Config Path:    frontend/railway.toml (this file)
#
# nginx serves the built SPA and reverse-proxies /api to the backend service.
# Set BACKEND_URL to the backend's PRIVATE networking URL so /api traffic stays
# inside Railway's network, e.g.:
#   BACKEND_URL=http://${{backend.RAILWAY_PRIVATE_DOMAIN}}:${{backend.PORT}}
# (replace `backend` with your actual backend service name).
#
# Railway injects PORT; the nginx template listens on ${PORT}. No CORS needed
# since the browser talks only to this same-origin frontend.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

